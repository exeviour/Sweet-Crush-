<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sweet Crush — Infinite Match-3 App</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at top, #273052, #111524);
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: #fff;
    }
    .app-shell {
      width: 390px;
      height: 780px;
      border-radius: 38px;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background:
        radial-gradient(circle at 50% 28%, rgba(164, 120, 255, 0.45), transparent 55%),
        linear-gradient(180deg, #3f53b8 0%, #6858c7 45%, #4d88db 100%);
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.65), inset 0 0 0 3px rgba(255, 255, 255, 0.16);
    }
    .peaks {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }
    .peaks::before {
      content: "";
      position: absolute;
      left: -15%;
      right: -15%;
      bottom: 84px;
      height: 230px;
      background: linear-gradient(135deg, transparent 48%, rgba(88, 152, 232, 0.55) 49%, rgba(62, 120, 205, 0.75) 100%);
      clip-path: polygon(0% 100%, 14% 42%, 30% 78%, 48% 28%, 68% 72%, 85% 36%, 100% 82%, 100% 100%);
    }
    .top-hud {
      position: relative;
      z-index: 2;
      padding: 16px 16px 12px;
      background: linear-gradient(180deg, rgba(22, 33, 78, 0.85), rgba(34, 52, 118, 0.35));
      border-bottom-left-radius: 26px;
      border-bottom-right-radius: 26px;
    }
    .hud-top { display: flex; align-items: center; gap: 10px; }
    .moves-pill {
      background: linear-gradient(180deg, #283d8f, #18255c);
      border: 2px solid #8cb2ff;
      border-radius: 18px;
      padding: 6px 12px;
      text-align: center;
      min-width: 74px;
      box-shadow: 0 5px 12px rgba(0, 0, 0, 0.35);
    }
    .moves-val { font-size: 28px; font-weight: 900; line-height: 1; }
    .moves-sub { font-size: 10px; letter-spacing: 1px; color: #c8dcff; margin-top: 2px; }
    .meter-box { flex: 1; }
    .meter-track {
      height: 15px;
      border-radius: 999px;
      background: rgba(13, 20, 48, 0.72);
      border: 2px solid rgba(255, 255, 255, 0.35);
      padding: 2px;
      overflow: hidden;
    }
    .meter-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, #ffd84d, #ff8524, #ff4766);
      transition: width 0.25s ease;
    }
    .star-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin-top: 4px;
      padding: 0 6px;
      color: #ffe885;
      font-weight: 700;
    }
    .mascot {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 25%, #fff0b8, #e88b68);
      border: 3px solid #ffffff;
      display: grid;
      place-items: center;
      font-size: 26px;
      box-shadow: 0 5px 14px rgba(0, 0, 0, 0.35);
    }
    .sub-row {
      margin-top: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .level-tag {
      background: rgba(18, 28, 68, 0.8);
      border: 1.5px solid rgba(255, 255, 255, 0.35);
      color: #fff3b0;
      padding: 5px 14px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 13px;
    }
    .goal-pill {
      background: linear-gradient(180deg, #ffffff, #e6efff);
      color: #1f2847;
      padding: 5px 16px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 800;
      font-size: 13px;
      box-shadow: 0 5px 14px rgba(15, 25, 65, 0.35);
    }
    .next-btn {
      background: linear-gradient(180deg, #4ade80, #16a34a);
      color: #fff;
      border: 2px solid #bbf7d0;
      border-radius: 999px;
      padding: 5px 14px;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
      display: none;
    }
    .next-btn.show { display: inline-block; }
    .toast {
      position: relative;
      z-index: 2;
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      padding: 4px 12px;
      min-height: 24px;
      color: #fff8d6;
    }
    .playfield {
      position: relative;
      z-index: 2;
      margin: auto;
      display: grid;
      grid-template-columns: repeat(7, 48px);
      grid-template-rows: repeat(7, 48px);
      gap: 2px;
      padding: 10px;
      border-radius: 28px;
      background: rgba(24, 36, 82, 0.28);
    }
    .slot {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      cursor: pointer;
      border-radius: 50%;
    }
    .slot.void { visibility: hidden; pointer-events: none; }
    .slot.frosting {
      background: radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.52), rgba(188, 224, 255, 0.22));
      border-radius: 16px;
    }
    .piece {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      position: relative;
      transition: transform 0.15s ease;
      box-shadow: inset 0 -5px 8px rgba(0,0,0,0.32), inset 0 4px 7px rgba(255,255,255,0.65), 0 6px 10px rgba(10,16,40,0.35);
    }
    .piece::before {
      content: "";
      position: absolute;
      top: 5px;
      left: 7px;
      width: 12px;
      height: 7px;
      border-radius: 50%;
      background: rgba(255,255,255,0.82);
      transform: rotate(-22deg);
    }
    .slot.selected .piece { transform: scale(1.16); box-shadow: 0 0 0 3px #fff, 0 0 16px rgba(255,255,255,0.95); }
    .p0 { background: radial-gradient(circle at 32% 28%, #ff857a, #d62424); }
    .p1 { background: radial-gradient(circle at 32% 28%, #82caff, #1d74d6); border-radius: 14px; }
    .p2 { background: radial-gradient(circle at 32% 28%, #88f7ad, #189e47); border-radius: 18px 7px 18px 7px; }
    .p3 { background: radial-gradient(circle at 32% 28%, #fff385, #e3a300); }
    .p4 { background: radial-gradient(circle at 32% 28%, #dea8ff, #8132c7); border-radius: 11px; }
    .p5 { background: radial-gradient(circle at 32% 28%, #ffbe78, #d96011); }
    .sp-line::after {
      content: "";
      position: absolute;
      left: -4px;
      right: -4px;
      top: 50%;
      height: 5px;
      transform: translateY(-50%);
      border-radius: 999px;
      background: #fff;
    }
    .sp-bomb { box-shadow: 0 0 0 3px #fff, 0 0 14px rgba(255,240,150,0.95); }
    .dock {
      position: relative;
      z-index: 2;
      background: linear-gradient(180deg, rgba(244,248,255,0.95), rgba(214,228,252,0.98));
      border-top-left-radius: 26px;
      border-top-right-radius: 26px;
      padding: 12px 14px 16px;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }
    .orb-btn {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      border: 2px solid #6b9be8;
      background: radial-gradient(circle at 35% 25%, #ffffff, #cbe0ff);
      display: grid;
      place-items: center;
      font-size: 22px;
      cursor: pointer;
      position: relative;
    }
    .orb-btn.armed { border-color: #ff8c00; box-shadow: 0 0 0 3px rgba(255,140,0,0.45); }
    .pill-num {
      position: absolute;
      bottom: -4px;
      right: -2px;
      background: #2563eb;
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      padding: 1px 6px;
      border-radius: 999px;
      border: 1.5px solid #fff;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <div class="peaks"></div>
    <div>
      <div class="top-hud">
        <div class="hud-top">
          <div class="moves-pill">
            <div class="moves-val" id="moves">20</div>
            <div class="moves-sub">MOVES</div>
          </div>
          <div class="meter-box">
            <div class="meter-track"><div class="meter-fill" id="meter"></div></div>
            <div class="star-row">
              <span>★</span><span>★★</span><span>★★★ <span id="score">0/1000</span></span>
            </div>
          </div>
          <div class="mascot">🐻</div>
        </div>
        <div class="sub-row">
          <div class="level-tag" id="level-tag">LVL 1 · ∞</div>
          <div class="goal-pill"><span>GOAL</span><span id="goal">10</span><span>🍬</span></div>
          <button class="next-btn" id="next-btn">Next Level ▶</button>
        </div>
      </div>
      <div class="toast" id="toast">Tap two adjacent candies to swap</div>
    </div>
    <div class="playfield" id="playfield"></div>
    <div class="dock">
      <button class="orb-btn" id="reset-btn" title="Retry Level">🔄</button>
      <button class="orb-btn" id="hammer-btn" title="Smash 1 candy">🔨<span class="pill-num" id="hammer-n">2</span></button>
      <button class="orb-btn" id="shuffle-btn" title="Shuffle candies">🔀<span class="pill-num" id="shuffle-n">2</span></button>
      <button class="orb-btn" id="bomb-btn" title="3x3 Blast">💣<span class="pill-num" id="bomb-n">1</span></button>
    </div>
  </div>
  <script>

    const SIZE = 7, TYPES = 6;
const PATTERNS = [
  { voids: ["0,0","0,1","0,5","0,6","1,0","1,6","5,0","5,6","6,0","6,1","6,5","6,6"], frost: ["3,2","3,3","3,4"] },
  { voids: ["0,0","0,6","6,0","6,6"], frost: ["2,2","2,4","4,2","4,4"] },
  { voids: ["0,0","0,1","5,5","6,5","6,6"], frost: ["3,1","3,2","3,4","3,5"] },
  { voids: ["0,3","3,0","3,6","6,3"], frost: ["1,3","3,1","3,5","5,3"] }
];

let level = 1, target = 1000, goalTotal = 10, maxMoves = 20;
let voids = new Set(), frost = new Set(), grid = [], selected = null;
let score = 0, goalDone = 0, moves = 20, mode = null;
let hammers = 2, shuffles = 2, bombs = 1, busy = false, levelCleared = false;

const fieldEl = document.getElementById("playfield");
const toastEl = document.getElementById("toast");
const nextBtn = document.getElementById("next-btn");
const isVoid = (r, c) => voids.has(`${r},${c}`);

function buildLevelConfig(lvl) {
  const pat = PATTERNS[(lvl - 1) % PATTERNS.length];
  return {
    voids: new Set(pat.voids),
    frost: new Set(pat.frost),
    target: 1000 + (lvl - 1) * 450,
    goalTotal: 10 + (lvl - 1) * 3,
    maxMoves: Math.max(16, 22 - Math.floor((lvl - 1) / 3))
  };
}

function startLevel(lvl = level) {
  level = lvl;
  const cfg = buildLevelConfig(level);
  voids = cfg.voids;
  frost = cfg.frost;
  target = cfg.target;
  goalTotal = cfg.goalTotal;
  maxMoves = cfg.maxMoves;
  moves = maxMoves;
  score = 0;
  goalDone = 0;
  selected = null;
  mode = null;
  levelCleared = false;
  nextBtn.classList.remove("show");

  grid = Array.from({ length: SIZE }, (_, r) =>
    Array.from({ length: SIZE }, (_, c) => {
      if (isVoid(r, c)) return null;
      const bad = new Set();
      if (c >= 2 && grid[r]?.[c - 1]?.type === grid[r]?.[c - 2]?.type) bad.add(grid[r][c - 1].type);
      if (r >= 2 && grid[r - 1]?.[c]?.type === grid[r - 2]?.[c]?.type) bad.add(grid[r - 1][c].type);
      const pool = Array.from({ length: TYPES }, (_, i) => i).filter(i => !bad.has(i));
      return { type: pool[Math.floor(Math.random() * pool.length)], special: null };
    })
  );
  syncUI(`Level ${level} — Reach ${target} pts & clear ${goalTotal} 🍬`);
  draw();
}

function syncUI(msg) {
  document.getElementById("level-tag").textContent = `LVL ${level} · ∞`;
  document.getElementById("moves").textContent = moves;
  document.getElementById("score").textContent = `${score}/${target}`;
  document.getElementById("goal").textContent = Math.max(0, goalTotal - goalDone);
  document.getElementById("meter").style.width = `${Math.min(100, (score / target) * 100)}%`;
  document.getElementById("hammer-n").textContent = hammers;
  document.getElementById("shuffle-n").textContent = shuffles;
  document.getElementById("bomb-n").textContent = bombs;
  document.getElementById("hammer-btn").classList.toggle("armed", mode === "hammer");
  document.getElementById("bomb-btn").classList.toggle("armed", mode === "bomb");
  if (msg) toastEl.textContent = msg;
}

function findMatches() {
  const matched = new Set();
  const specials = [];
  for (let r = 0; r < SIZE; r++) {
    let c = 0;
    while (c < SIZE) {
      const cur = grid[r][c];
      if (!cur) { c++; continue; }
      let end = c + 1;
      while (end < SIZE && grid[r][end]?.type === cur.type) end++;
      if (end - c >= 3) {
        for (let k = c; k < end; k++) matched.add(`${r},${k}`);
        if (end - c >= 4) specials.push({ r, c: Math.floor((c + end - 1) / 2), type: cur.type, special: end - c >= 5 ? "bomb" : "line" });
      }
      c = end;
    }
  }
  for (let c = 0; c < SIZE; c++) {
    let r = 0;
    while (r < SIZE) {
      const cur = grid[r][c];
      if (!cur) { r++; continue; }
      let end = r + 1;
      while (end < SIZE && grid[end][c]?.type === cur.type) end++;
      if (end - r >= 3) {
        for (let k = r; k < end; k++) matched.add(`${k},${c}`);
        if (end - r >= 4) specials.push({ r: Math.floor((r + end - 1) / 2), c, type: cur.type, special: end - r >= 5 ? "bomb" : "line" });
      }
      r = end;
    }
  }
  return { matched, specials };
}

function dropCandies() {
  for (let c = 0; c < SIZE; c++) {
    let write = SIZE - 1;
    for (let r = SIZE - 1; r >= 0; r--) {
      if (isVoid(r, c)) { write = r - 1; continue; }
      if (grid[r][c]) {
        if (write !== r) { grid[write][c] = grid[r][c]; grid[r][c] = null; }
        write--;
      }
    }
    for (let r = write; r >= 0; r--) {
      if (!isVoid(r, c)) grid[r][c] = { type: Math.floor(Math.random() * TYPES), special: null };
    }
  }
}

async function settle(combo = 1) {
  busy = true;
  while (true) {
    const { matched, specials } = findMatches();
    if (!matched.size) break;
    const blast = new Set(matched);
    for (const key of matched) {
      const [r, c] = key.split(",").map(Number);
      const item = grid[r][c];
      if (item?.special === "line") {
        for (let cc = 0; cc < SIZE; cc++) if (!isVoid(r, cc)) blast.add(`${r},${cc}`);
      } else if (item?.special === "bomb") {
        for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
          const nr = r + dr, nc = c + dc;
          if (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE && !isVoid(nr, nc)) blast.add(`${nr},${nc}`);
        }
      }
    }
    for (const key of blast) {
      frost.delete(key);
      const [r, c] = key.split(",").map(Number);
      if (grid[r][c]?.type === 0) goalDone++;
      grid[r][c] = null;
    }
    for (const sp of specials) {
      if (!isVoid(sp.r, sp.c)) grid[sp.r][sp.c] = { type: sp.type, special: sp.special };
    }
    score += blast.size * 25 * combo;
    draw();
    await new Promise(r => setTimeout(r, 170));
    dropCandies();
    draw();
    await new Promise(r => setTimeout(r, 170));
    combo++;
  }

  if (!levelCleared && score >= target && goalDone >= goalTotal) {
    levelCleared = true;
    hammers++;
    bombs++;
    nextBtn.classList.add("show");
    syncUI(`Level ${level} Cleared! +1 🔨 & +1 💣 earned!`);
  } else if (!levelCleared && moves <= 0) {
    syncUI("Out of moves! Tap 🔄 to retry");
  } else if (!levelCleared) {
    syncUI(combo > 1 ? `Sweet Combo x${combo}!` : "Ready");
  }
  busy = false;
}

async function onTap(r, c) {
  if (busy || moves <= 0 || isVoid(r, c) || !grid[r][c]) return;
  if (mode === "hammer" && hammers > 0) {
    hammers--; mode = null; frost.delete(`${r},${c}`); grid[r][c] = null; score += 50;
    dropCandies(); draw(); await settle(); return;
  }
  if (mode === "bomb" && bombs > 0) {
    bombs--; mode = null;
    for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
      const nr = r + dr, nc = c + dc;
      if (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE && !isVoid(nr, nc)) { frost.delete(`${nr},${nc}`); grid[nr][nc] = null; }
    }
    score += 150; dropCandies(); draw(); await settle(); return;
  }
  if (!selected) { selected = { r, c }; draw(); return; }
  if (Math.abs(selected.r - r) + Math.abs(selected.c - c) !== 1) { selected = { r, c }; draw(); return; }

  const a = selected, b = { r, c };
  selected = null;
  [grid[a.r][a.c], grid[b.r][b.c]] = [grid[b.r][b.c], grid[a.r][a.c]];
  draw();

  if (findMatches().matched.size) {
    moves--; syncUI(); await settle();
  } else {
    await new Promise(r => setTimeout(r, 150));
    [grid[a.r][a.c], grid[b.r][b.c]] = [grid[b.r][b.c], grid[a.r][a.c]];
    syncUI("Try another swap");
    draw();
  }
}

function draw() {
  fieldEl.innerHTML = "";
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      const slot = document.createElement("div");
      slot.className = "slot";
      if (isVoid(r, c)) {
        slot.classList.add("void");
      } else {
        if (frost.has(`${r},${c}`)) slot.classList.add("frosting");
        if (selected && selected.r === r && selected.c === c) slot.classList.add("selected");
        const item = grid[r][c];
        if (item) {
          const piece = document.createElement("div");
          piece.className = `piece p${item.type}`;
          if (item.special === "line") piece.classList.add("sp-line");
          if (item.special === "bomb") piece.classList.add("sp-bomb");
          slot.appendChild(piece);
        }
        slot.onclick = () => onTap(r, c);
      }
      fieldEl.appendChild(slot);
    }
  }
}

nextBtn.onclick = () => startLevel(level + 1);
document.getElementById("reset-btn").onclick = () => startLevel(level);
document.getElementById("hammer-btn").onclick = () => {
  if (!busy && hammers > 0) { mode = mode === "hammer" ? null : "hammer"; syncUI(mode ? "Tap a candy to smash" : "Ready"); }
};
document.getElementById("bomb-btn").onclick = () => {
  if (!busy && bombs > 0) { mode = mode === "bomb" ? null : "bomb"; syncUI(mode ? "Tap for 3x3 blast" : "Ready"); }
};
document.getElementById("shuffle-btn").onclick = () => {
  if (busy || shuffles <= 0) return;
  shuffles--;
  const list = [];
  for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) if (grid[r][c]) list.push(grid[r][c]);
  list.sort(() => Math.random() - 0.5);
  let idx = 0;
  for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) if (grid[r][c]) grid[r][c] = list[idx++];
  syncUI("Candies shuffled!");
  draw();
};

startLevel(1);
  </script>
</body>
</html>
