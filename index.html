
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sweet Crush — Infinite Levels Mobile App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@500;600;700;800&display=swap');

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
      background: radial-gradient(circle at top, #27325c 0%, #111526 70%, #0b0d18 100%);
      font-family: 'Inter', system-ui, sans-serif;
      color: #ffffff;
      overflow-x: hidden;
    }

    .app-title-font {
      font-family: 'Fredoka', 'Inter', sans-serif;
    }

    /* Portrait App Shell */
    .phone-frame {
      width: 100%;
      max-width: 390px;
      height: 780px;
      max-height: 94vh;
      border-radius: 38px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background:
        radial-gradient(circle at 50% 28%, rgba(178, 130, 255, 0.42), transparent 58%),
        linear-gradient(180deg, #3f54bd 0%, #6a56ca 46%, #4b89de 100%);
      box-shadow:
        0 28px 70px rgba(0, 0, 0, 0.7),
        inset 0 0 0 3px rgba(255, 255, 255, 0.18);
    }

    /* Layered Mountain Backdrop */
    .mountain-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .mountain-back {
      position: absolute;
      left: -12%;
      right: -12%;
      bottom: 84px;
      height: 250px;
      background: linear-gradient(180deg, rgba(136, 178, 248, 0.45), rgba(84, 132, 218, 0.65));
      clip-path: polygon(0% 100%, 12% 48%, 27% 76%, 46% 30%, 66% 68%, 84% 34%, 100% 78%, 100% 100%);
    }

    .mountain-front {
      position: absolute;
      left: -14%;
      right: -14%;
      bottom: 76px;
      height: 195px;
      background: linear-gradient(180deg, rgba(84, 148, 232, 0.62), rgba(52, 108, 196, 0.85));
      clip-path: polygon(0% 100%, 16% 56%, 34% 82%, 55% 40%, 75% 74%, 92% 45%, 100% 85%, 100% 100%);
    }

    /* Top HUD */
    .top-hud {
      position: relative;
      z-index: 2;
      padding: 13px 14px 10px;
      background: linear-gradient(180deg, rgba(20, 32, 78, 0.88), rgba(34, 52, 118, 0.38));
      border-bottom-left-radius: 26px;
      border-bottom-right-radius: 26px;
      backdrop-filter: blur(6px);
    }

    .moves-badge {
      background: linear-gradient(180deg, #2b429c, #17245c);
      border: 2px solid #96baff;
      border-radius: 18px;
      padding: 6px 10px;
      min-width: 72px;
      text-align: center;
      box-shadow: 0 5px 12px rgba(0, 0, 0, 0.35);
    }

    .meter-track {
      height: 15px;
      border-radius: 999px;
      background: rgba(11, 18, 44, 0.75);
      border: 2px solid rgba(255, 255, 255, 0.36);
      padding: 2px;
      overflow: hidden;
    }

    .meter-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, #ffe054, #ff8b24, #ff4766);
      transition: width 0.25s ease;
    }

    .mascot-badge {
      width: 50px;
      height: 50px;
      border-radius: 999px;
      background: radial-gradient(circle at 30% 25%, #fff2be, #e98a67);
      border: 3px solid #ffffff;
      display: grid;
      place-items: center;
      font-size: 25px;
      flex-shrink: 0;
      box-shadow: 0 5px 14px rgba(0, 0, 0, 0.35);
    }

    .level-pill {
      background: rgba(18, 28, 68, 0.75);
      border: 1.5px solid rgba(182, 212, 255, 0.55);
      color: #eef5ff;
      border-radius: 999px;
      padding: 4px 12px;
      font-weight: 800;
      font-size: 12px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .goal-pill {
      background: linear-gradient(180deg, #ffffff, #e5efff);
      color: #1c2544;
      border-radius: 999px;
      padding: 4px 14px;
      font-weight: 800;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 5px 14px rgba(14, 24, 62, 0.35);
    }

    .next-level-btn {
      background: linear-gradient(180deg, #4ade80, #16a34a);
      color: #ffffff;
      border: 2px solid #bbf7d0;
      border-radius: 999px;
      padding: 5px 14px;
      font-weight: 800;
      font-size: 12px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(22, 163, 74, 0.45);
      transition: transform 0.12s ease, filter 0.12s ease;
    }

    .next-level-btn:hover {
      filter: brightness(1.06);
    }

    .next-level-btn:active {
      transform: scale(0.95);
    }

    /* Non-Boxy Floating Playfield */
    .playfield-wrap {
      position: relative;
      z-index: 2;
      flex: 1;
      display: grid;
      place-items: center;
      padding: 6px 10px;
    }

    .playfield {
      display: grid;
      grid-template-columns: repeat(7, 46px);
      grid-template-rows: repeat(7, 46px);
      gap: 3px;
      padding: 8px;
      border-radius: 28px;
      background: rgba(20, 32, 76, 0.25);
    }

    @media (max-width: 380px) {
      .playfield {
        grid-template-columns: repeat(7, 40px);
        grid-template-rows: repeat(7, 40px);
        gap: 2px;
      }
      .slot {
        width: 40px !important;
        height: 40px !important;
      }
      .piece {
        width: 32px !important;
        height: 32px !important;
      }
    }

    .slot {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      position: relative;
      cursor: pointer;
      border-radius: 999px;
      touch-action: none;
    }

    .slot.void {
      visibility: hidden;
      pointer-events: none;
    }

    .slot.frosting {
      background: radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.54), rgba(182, 222, 255, 0.24));
      border-radius: 16px;
      box-shadow: inset 0 2px 5px rgba(255, 255, 255, 0.75);
    }

    /* Glossy Rounded Candies */
    .piece {
      width: 37px;
      height: 37px;
      border-radius: 999px;
      position: relative;
      transition: transform 0.14s ease, filter 0.14s ease;
      box-shadow:
        inset 0 -5px 8px rgba(0, 0, 0, 0.34),
        inset 0 4px 7px rgba(255, 255, 255, 0.68),
        0 6px 10px rgba(10, 16, 40, 0.36);
    }

    .piece::before {
      content: "";
      position: absolute;
      top: 5px;
      left: 7px;
      width: 11px;
      height: 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.85);
      transform: rotate(-22deg);
      pointer-events: none;
    }

    .slot.selected .piece {
      transform: scale(1.16);
      filter: brightness(1.14);
      box-shadow:
        0 0 0 3px #ffffff,
        0 0 16px rgba(255, 255, 255, 0.95),
        0 8px 14px rgba(0, 0, 0, 0.45);
    }

    /* 6 Distinct Candy Types & Silhouettes */
    .p0 { background: radial-gradient(circle at 32% 28%, #ff857a, #d62424); }
    .p1 { background: radial-gradient(circle at 32% 28%, #82caff, #1d74d6); border-radius: 13px; }
    .p2 { background: radial-gradient(circle at 32% 28%, #88f7ad, #189e47); border-radius: 18px 6px 18px 6px; }
    .p3 { background: radial-gradient(circle at 32% 28%, #fff385, #e3a300); }
    .p4 { background: radial-gradient(circle at 32% 28%, #dea8ff, #8132c7); border-radius: 10px; }
    .p5 { background: radial-gradient(circle at 32% 28%, #ffbe78, #d96011); border-radius: 8px 18px 8px 18px; }

    /* Special Candies: Line Blaster & 3x3 Bomb */
    .sp-line::after {
      content: "";
      position: absolute;
      left: -5px;
      right: -5px;
      top: 50%;
      height: 5px;
      transform: translateY(-50%);
      border-radius: 999px;
      background: #ffffff;
      box-shadow: 0 0 8px #ffffff;
      pointer-events: none;
    }

    .sp-bomb {
      box-shadow:
        0 0 0 3px #ffffff,
        0 0 15px rgba(255, 242, 160, 0.98),
        0 6px 12px rgba(0, 0, 0, 0.42);
    }

    .sp-bomb::after {
      content: "✦";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 15px;
      color: #ffffff;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.65);
      pointer-events: none;
    }

    /* Bottom Booster Dock */
    .booster-dock {
      position: relative;
      z-index: 2;
      background: linear-gradient(180deg, rgba(244, 248, 255, 0.95), rgba(214, 228, 252, 0.98));
      border-top-left-radius: 26px;
      border-top-right-radius: 26px;
      padding: 12px 14px 16px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      box-shadow: 0 -8px 24px rgba(12, 20, 54, 0.35);
    }

    .booster-btn {
      width: 54px;
      height: 54px;
      border-radius: 999px;
      border: 2px solid #6b9be8;
      background: radial-gradient(circle at 35% 25%, #ffffff, #cbe0ff);
      display: grid;
      place-items: center;
      font-size: 22px;
      cursor: pointer;
      position: relative;
      box-shadow: 0 5px 10px rgba(26, 46, 102, 0.25);
      transition: transform 0.12s ease;
    }

    .booster-btn:active {
      transform: scale(0.94);
    }

    .booster-btn.armed {
      border-color: #ff8c00;
      box-shadow: 0 0 0 3px rgba(255, 140, 0, 0.48), 0 6px 12px rgba(0, 0, 0, 0.25);
    }

    .count-badge {
      position: absolute;
      bottom: -4px;
      right: -2px;
      background: #2563eb;
      color: #ffffff;
      font-size: 11px;
      font-weight: 800;
      padding: 1px 6px;
      border-radius: 999px;
      border: 1.5px solid #ffffff;
    }
  </style>
</head>
<body>
  <main class="phone-frame" aria-label="Sweet Crush Infinite Levels Mobile App">
    <!-- Mountain Backdrop -->
    <div class="mountain-layer" aria-hidden="true">
      <div class="mountain-back"></div>
      <div class="mountain-front"></div>
    </div>

    <!-- Top HUD -->
    <header class="top-hud">
      <div class="flex items-center gap-2.5">
        <div class="moves-badge">
          <div id="moves-val" class="app-title-font text-2xl font-bold leading-none">20</div>
          <div class="text-[10px] font-bold tracking-wider text-blue-100 mt-0.5">MOVES</div>
        </div>

        <div class="flex-1">
          <div class="meter-track">
            <div id="meter-fill" class="meter-fill"></div>
          </div>
          <div class="flex justify-between items-center text-xs font-bold text-amber-200 mt-1 px-1">
            <span>★</span>
            <span>★★</span>
            <span>★★★ <span id="score-txt">0/1000</span></span>
          </div>
        </div>

        <div class="mascot-badge" title="Level Buddy">🐻</div>
      </div>

      <div class="flex items-center justify-center gap-2 mt-2 flex-wrap">
        <span class="level-pill">LVL <span id="level-val">1</span></span>
        <div class="goal-pill">
          <span>GOAL</span>
          <span id="goal-val">12</span>
          <span id="goal-icon">🍬</span>
        </div>
        <button id="btn-next-level" type="button" class="next-level-btn hidden">
          Next Level ▶
        </button>
      </div>

      <div id="status-toast" class="text-center text-xs font-semibold text-amber-100 mt-1.5 min-h-[18px]">
        Tap or swipe adjacent candies to match 3+
      </div>
    </header>

    <!-- Non-Boxy Floating Playfield -->
    <section class="playfield-wrap" aria-label="Match-3 Board">
      <div id="playfield" class="playfield"></div>
    </section>

    <!-- Bottom Booster Dock -->
    <footer class="booster-dock" aria-label="Boosters">
      <button id="btn-reset" type="button" class="booster-btn" title="Retry Current Level" aria-label="Retry Current Level">
        🔄
      </button>
      <button id="btn-hammer" type="button" class="booster-btn" title="Lollipop Hammer (Clear 1 candy)" aria-label="Hammer Booster">
        🔨<span id="cnt-hammer" class="count-badge">2</span>
      </button>
      <button id="btn-shuffle" type="button" class="booster-btn" title="Shuffle Board" aria-label="Shuffle Booster">
        🔀<span id="cnt-shuffle" class="count-badge">2</span>
      </button>
      <button id="btn-bomb" type="button" class="booster-btn" title="Party Bomb (3x3 blast)" aria-label="3x3 Bomb Booster">
        💣<span id="cnt-bomb" class="count-badge">1</span>
      </button>
    </footer>
  </main>

  <script>
    const SIZE = 7;
    const TYPES = 6;
    const GOAL_ICONS = ["🍬", "💎", "🥝", "⭐", "🍇", "🍊"];

    // Distinct cutout patterns cycled and varied infinitely across levels
    const CUTOUT_PATTERNS = [
      // Pattern 0: Rounded diamond corners
      new Set([
        "0,0", "0,1", "0,5", "0,6",
        "1,0", "1,6",
        "5,0", "5,6",
        "6,0", "6,1", "6,5", "6,6"
      ]),
      // Pattern 1: Hourglass / waist cutouts
      new Set([
        "2,0", "3,0", "4,0",
        "2,6", "3,6", "4,6"
      ]),
      // Pattern 2: Corner steps
      new Set([
        "0,0", "0,1", "1,0",
        "0,5", "0,6", "1,6",
        "5,0", "6,0", "6,1",
        "6,5", "6,6", "5,6"
      ]),
      // Pattern 3: Arch top & bottom notches
      new Set([
        "0,3", "6,3",
        "3,0", "3,6"
      ])
    ];

    let currentLevel = 1;
    let targetScore = 1000;
    let goalTotal = 12;
    let goalCandyType = 0;
    let voidCells = new Set();
    let initialFrosting = new Set();

    let grid = [];
    let frosting = new Set();
    let selected = null;
    let pointerStart = null;
    let score = 0;
    let goalCleared = 0;
    let movesLeft = 20;
    let levelCompleted = false;

    let activeBooster = null;
    let hammerCount = 2;
    let shuffleCount = 2;
    let bombCount = 1;
    let isBusy = false;

    const playfieldEl = document.getElementById("playfield");
    const toastEl = document.getElementById("status-toast");
    const nextLevelBtn = document.getElementById("btn-next-level");

    const isVoid = (r, c) => voidCells.has(`${r},${c}`);
    const inBounds = (r, c) => r >= 0 && r < SIZE && c >= 0 && c < SIZE && !isVoid(r, c);

    // Deterministic-friendly infinite level generator
    function generateLevelConfig(lvl) {
      const pattern = CUTOUT_PATTERNS[(lvl - 1) % CUTOUT_PATTERNS.length];
      const voids = new Set(pattern);

      // Every 5th level adds an extra pair of inner cutouts while keeping plenty of playable tiles
      if (lvl % 5 === 0) {
        voids.add("2,3");
        voids.add("4,3");
      }

      const frost = new Set();
      const frostCount = Math.min(9, 2 + Math.floor(lvl * 0.8));
      const candidates = [];
      for (let r = 1; r < SIZE - 1; r++) {
        for (let c = 1; c < SIZE - 1; c++) {
          if (!voids.has(`${r},${c}`)) {
            candidates.push(`${r},${c}`);
          }
        }
      }
      // Rotate candidates by level index so frosting spreads naturally
      const offset = (lvl * 3) % Math.max(1, candidates.length);
      for (let i = 0; i < frostCount && i < candidates.length; i++) {
        frost.add(candidates[(offset + i * 2) % candidates.length]);
      }

      const scaledTarget = 900 + (lvl - 1) * 350 + Math.floor(Math.pow(lvl, 1.35) * 40);
      const scaledGoal = Math.min(35, 10 + lvl * 2);
      const scaledMoves = Math.max(15, 22 - (lvl % 3) + Math.floor(lvl / 4));
      const candyType = (lvl - 1) % TYPES;

      return {
        targetScore: Math.round(scaledTarget / 50) * 50,
        goalTotal: scaledGoal,
        moves: scaledMoves,
        goalCandyType: candyType,
        voidCells: voids,
        initialFrosting: frost
      };
    }

    function startLevel(lvl = currentLevel, grantBoosterBonus = false) {
      try {
        currentLevel = Math.max(1, lvl);
        const cfg = generateLevelConfig(currentLevel);
        targetScore = cfg.targetScore;
        goalTotal = cfg.goalTotal;
        movesLeft = cfg.moves;
        goalCandyType = cfg.goalCandyType;
        voidCells = cfg.voidCells;
        initialFrosting = cfg.initialFrosting;

        if (grantBoosterBonus && currentLevel > 1) {
          hammerCount += 1;
          shuffleCount += 1;
          if (currentLevel % 2 === 0) bombCount += 1;
        }

        frosting = new Set(initialFrosting);
        grid = Array.from({ length: SIZE }, (_, r) =>
          Array.from({ length: SIZE }, (_, c) => {
            if (!inBounds(r, c)) return null;
            const blockedTypes = new Set();
            if (c >= 2 && grid[r]?.[c - 1] && grid[r]?.[c - 1]?.type === grid[r]?.[c - 2]?.type) {
              blockedTypes.add(grid[r][c - 1].type);
            }
            if (r >= 2 && grid[r - 1]?.[c] && grid[r - 1]?.[c]?.type === grid[r - 2]?.[c]?.type) {
              blockedTypes.add(grid[r - 1][c].type);
            }
            const options = Array.from({ length: TYPES }, (_, i) => i).filter(i => !blockedTypes.has(i));
            const chosen = options[Math.floor(Math.random() * options.length)] ?? Math.floor(Math.random() * TYPES);
            return { type: chosen, special: null };
          })
        );

        score = 0;
        goalCleared = 0;
        selected = null;
        pointerStart = null;
        activeBooster = null;
        levelCompleted = false;
        isBusy = false;

        nextLevelBtn.classList.add("hidden");
        syncHud(
          grantBoosterBonus
            ? `Level ${currentLevel}! +1 Hammer & Shuffle bonus`
            : `Level ${currentLevel} — Match ${goalTotal} ${GOAL_ICONS[goalCandyType]} & reach ${targetScore} pts`
        );
        renderBoard();
      } catch (err) {
        toastEl.textContent = "Resetting level...";
      }
    }

    function syncHud(message) {
      document.getElementById("level-val").textContent = currentLevel;
      document.getElementById("moves-val").textContent = movesLeft;
      document.getElementById("score-txt").textContent = `${score}/${targetScore}`;
      document.getElementById("goal-val").textContent = Math.max(0, goalTotal - goalCleared);
      document.getElementById("goal-icon").textContent = GOAL_ICONS[goalCandyType];
      document.getElementById("meter-fill").style.width = `${Math.min(100, (score / targetScore) * 100)}%`;
      document.getElementById("cnt-hammer").textContent = hammerCount;
      document.getElementById("cnt-shuffle").textContent = shuffleCount;
      document.getElementById("cnt-bomb").textContent = bombCount;
      document.getElementById("btn-hammer").classList.toggle("armed", activeBooster === "hammer");
      document.getElementById("btn-bomb").classList.toggle("armed", activeBooster === "bomb");
      if (message) toastEl.textContent = message;
    }

    function findMatches() {
      const matched = new Set();
      const spawnedSpecials = [];

      // Horizontal runs
      for (let r = 0; r < SIZE; r++) {
        let c = 0;
        while (c < SIZE) {
          const cur = grid[r][c];
          if (!cur) { c++; continue; }
          let end = c + 1;
          while (end < SIZE && grid[r][end]?.type === cur.type) end++;
          const len = end - c;
          if (len >= 3) {
            for (let k = c; k < end; k++) matched.add(`${r},${k}`);
            if (len >= 4) {
              spawnedSpecials.push({
                r,
                c: Math.floor((c + end - 1) / 2),
                type: cur.type,
                special: len >= 5 ? "bomb" : "line"
              });
            }
          }
          c = end;
        }
      }

      // Vertical runs
      for (let c = 0; c < SIZE; c++) {
        let r = 0;
        while (r < SIZE) {
          const cur = grid[r][c];
          if (!cur) { r++; continue; }
          let end = r + 1;
          while (end < SIZE && grid[end][c]?.type === cur.type) end++;
          const len = end - r;
          if (len >= 3) {
            for (let k = r; k < end; k++) matched.add(`${k},${c}`);
            if (len >= 4) {
              spawnedSpecials.push({
                r: Math.floor((r + end - 1) / 2),
                c,
                type: cur.type,
                special: len >= 5 ? "bomb" : "line"
              });
            }
          }
          r = end;
        }
      }

      return { matched, spawnedSpecials };
    }

    function applyGravityAndRefill() {
      for (let c = 0; c < SIZE; c++) {
        let writeRow = SIZE - 1;
        for (let r = SIZE - 1; r >= 0; r--) {
          if (!inBounds(r, c)) {
            writeRow = r - 1;
            continue;
          }
          if (grid[r][c]) {
            if (writeRow !== r) {
              grid[writeRow][c] = grid[r][c];
              grid[r][c] = null;
            }
            writeRow--;
          }
        }
        for (let r = writeRow; r >= 0; r--) {
          if (inBounds(r, c)) {
            grid[r][c] = { type: Math.floor(Math.random() * TYPES), special: null };
          }
        }
      }
    }

    async function resolveCascades(combo = 1) {
      isBusy = true;
      try {
        while (true) {
          const { matched, spawnedSpecials } = findMatches();
          if (!matched.size) break;

          const clearSet = new Set(matched);
          for (const key of matched) {
            const [r, c] = key.split(",").map(Number);
            const item = grid[r][c];
            if (item?.special === "line") {
              for (let cc = 0; cc < SIZE; cc++) {
                if (inBounds(r, cc)) clearSet.add(`${r},${cc}`);
              }
            } else if (item?.special === "bomb") {
              for (let dr = -1; dr <= 1; dr++) {
                for (let dc = -1; dc <= 1; dc++) {
                  const nr = r + dr;
                  const nc = c + dc;
                  if (inBounds(nr, nc)) clearSet.add(`${nr},${nc}`);
                }
              }
            }
          }

          for (const key of clearSet) {
            frosting.delete(key);
            const [r, c] = key.split(",").map(Number);
            if (grid[r][c]?.type === goalCandyType) goalCleared++;
            grid[r][c] = null;
          }

          for (const sp of spawnedSpecials) {
            if (inBounds(sp.r, sp.c)) {
              grid[sp.r][sp.c] = { type: sp.type, special: sp.special };
            }
          }

          score += clearSet.size * 25 * combo;
          syncHud(combo > 1 ? `Sweet Combo x${combo}!` : "Nice match!");
          renderBoard();
          await new Promise(resolve => setTimeout(resolve, 175));

          applyGravityAndRefill();
          renderBoard();
          await new Promise(resolve => setTimeout(resolve, 175));
          combo++;
        }

        if (score >= targetScore && goalCleared >= goalTotal) {
          levelCompleted = true;
          nextLevelBtn.classList.remove("hidden");
          syncHud(`Level ${currentLevel} Complete! Tap Next Level ▶`);
        } else if (movesLeft <= 0) {
          syncHud(`Out of moves on Level ${currentLevel}! Tap 🔄 to retry`);
        }
      } finally {
        isBusy = false;
      }
    }

    async function trySwap(a, b) {
      if (levelCompleted || !inBounds(a.r, a.c) || !inBounds(b.r, b.c)) return;
      if (Math.abs(a.r - b.r) + Math.abs(a.c - b.c) !== 1) return;

      selected = null;
      const temp = grid[a.r][a.c];
      grid[a.r][a.c] = grid[b.r][b.c];
      grid[b.r][b.c] = temp;
      renderBoard();

      if (findMatches().matched.size > 0) {
        movesLeft = Math.max(0, movesLeft - 1);
        syncHud();
        await resolveCascades(1);
      } else {
        isBusy = true;
        await new Promise(resolve => setTimeout(resolve, 150));
        const revert = grid[a.r][a.c];
        grid[a.r][a.c] = grid[b.r][b.c];
        grid[b.r][b.c] = revert;
        isBusy = false;
        syncHud("No match there — try another move");
        renderBoard();
      }
    }

    async function handleCellAction(r, c) {
      if (isBusy || levelCompleted || movesLeft <= 0 || !inBounds(r, c) || !grid[r][c]) return;

      if (activeBooster === "hammer" && hammerCount > 0) {
        hammerCount--;
        activeBooster = null;
        frosting.delete(`${r},${c}`);
        if (grid[r][c].type === goalCandyType) goalCleared++;
        grid[r][c] = null;
        score += 50;
        applyGravityAndRefill();
        syncHud("Smashed!");
        renderBoard();
        await resolveCascades(1);
        return;
      }

      if (activeBooster === "bomb" && bombCount > 0) {
        bombCount--;
        activeBooster = null;
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            const nr = r + dr;
            const nc = c + dc;
            if (inBounds(nr, nc)) {
              frosting.delete(`${nr},${nc}`);
              if (grid[nr][nc]?.type === goalCandyType) goalCleared++;
              grid[nr][nc] = null;
            }
          }
        }
        score += 150;
        applyGravityAndRefill();
        syncHud("3x3 Blast!");
        renderBoard();
        await resolveCascades(1);
        return;
      }

      if (!selected) {
        selected = { r, c };
        renderBoard();
        return;
      }

      if (selected.r === r && selected.c === c) {
        selected = null;
        renderBoard();
        return;
      }

      if (Math.abs(selected.r - r) + Math.abs(selected.c - c) === 1) {
        await trySwap(selected, { r, c });
      } else {
        selected = { r, c };
        renderBoard();
      }
    }

    function renderBoard() {
      playfieldEl.innerHTML = "";
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          const slot = document.createElement("div");
          slot.className = "slot";

          if (!inBounds(r, c)) {
            slot.classList.add("void");
          } else {
            if (frosting.has(`${r},${c}`)) slot.classList.add("frosting");
            if (selected && selected.r === r && selected.c === c) slot.classList.add("selected");

            const item = grid[r][c];
            if (item) {
              const candy = document.createElement("div");
              candy.className = `piece p${item.type}`;
              if (item.special === "line") candy.classList.add("sp-line");
              if (item.special === "bomb") candy.classList.add("sp-bomb");
              slot.appendChild(candy);
            }

            // Support both click/tap and touch/pointer swipe gestures
            slot.addEventListener("pointerdown", (e) => {
              if (isBusy || levelCompleted) return;
              pointerStart = { r, c, x: e.clientX, y: e.clientY, swiped: false };
            });

            slot.addEventListener("pointermove", (e) => {
              if (!pointerStart || pointerStart.swiped || isBusy || levelCompleted || activeBooster) return;
              const dx = e.clientX - pointerStart.x;
              const dy = e.clientY - pointerStart.y;
              const threshold = 22;
              if (Math.hypot(dx, dy) >= threshold) {
                pointerStart.swiped = true;
                let dr = 0;
                let dc = 0;
                if (Math.abs(dx) > Math.abs(dy)) {
                  dc = dx > 0 ? 1 : -1;
                } else {
                  dr = dy > 0 ? 1 : -1;
                }
                const target = { r: pointerStart.r + dr, c: pointerStart.c + dc };
                const origin = { r: pointerStart.r, c: pointerStart.c };
                pointerStart = null;
                trySwap(origin, target);
              }
            });

            slot.addEventListener("click", () => {
              if (pointerStart && pointerStart.swiped) {
                pointerStart = null;
                return;
              }
              pointerStart = null;
              handleCellAction(r, c);
            });
          }

          playfieldEl.appendChild(slot);
        }
      }
    }

    nextLevelBtn.addEventListener("click", () => {
      if (!isBusy && levelCompleted) {
        startLevel(currentLevel + 1, true);
      }
    });

    document.getElementById("btn-reset").addEventListener("click", () => {
      if (!isBusy) {
        startLevel(currentLevel, false);
      }
    });

    document.getElementById("btn-hammer").addEventListener("click", () => {
      if (isBusy || levelCompleted || hammerCount <= 0) return;
      activeBooster = activeBooster === "hammer" ? null : "hammer";
      syncHud(activeBooster ? "Tap any candy to smash it" : "Booster cancelled");
    });

    document.getElementById("btn-bomb").addEventListener("click", () => {
      if (isBusy || levelCompleted || bombCount <= 0) return;
      activeBooster = activeBooster === "bomb" ? null : "bomb";
      syncHud(activeBooster ? "Tap a candy for a 3x3 blast" : "Booster cancelled");
    });

    document.getElementById("btn-shuffle").addEventListener("click", () => {
      if (isBusy || levelCompleted || shuffleCount <= 0) return;
      shuffleCount--;
      const pieces = [];
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          if (inBounds(r, c) && grid[r][c]) pieces.push(grid[r][c]);
        }
      }
      for (let i = pieces.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pieces[i], pieces[j]] = [pieces[j], pieces[i]];
      }
      let idx = 0;
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          if (inBounds(r, c) && grid[r][c]) grid[r][c] = pieces[idx++];
        }
      }
      selected = null;
      syncHud("Candies shuffled!");
      renderBoard();
    });

    startLevel(1, false);
  </script>
</body>
</html>
